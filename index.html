<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting to LINE...</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
        }
        .loader-container { text-align: center; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #06C755;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="loader-container">
        <div class="spinner"></div>
        <p>กำลังพาท่านไปยัง LINE OA...</p>
    </div>

    <script>
        const CONFIG = {
            liffId: '2006875744-pWcAixnJ',
            scriptUrl: 'https://script.google.com/macros/s/AKfycbydIczjRajY0u4NNMJwuSlaCbBMbj02uIOP0SMSrdx3MJ6D7kbj9p3jlvuD80oGE-nf/exec',
            lineOaUrl: 'https://lin.ee/joJYEeX'
        };

        async function main() {
            try {
                await liff.init({ liffId: CONFIG.liffId });

                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                const profile = await liff.getProfile();
                const urlParams = new URLSearchParams(window.location.search);
                
                // รวมข้อมูลส่งไปที่ Google Sheets
                const payload = {
                    userId: profile.userId,
                    displayName: profile.displayName,
                    pictureUrl: profile.pictureUrl, // ส่งรูปโปรไฟล์
                    utm_source: urlParams.get('utm_source') || 'Organic',
                    utm_medium: urlParams.get('utm_medium') || 'Social',
                    utm_campaign: urlParams.get('utm_campaign') || 'Organic_Reach',
                    utm_adset: urlParams.get('utm_adset') || '-',
                    utm_ad: urlParams.get('utm_ad') || '-',
                    timestamp: new Date().toLocaleString('th-TH', { timeZone: 'Asia/Bangkok' })
                };

                // ส่งข้อมูลเข้า Google Sheets
                fetch(CONFIG.scriptUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // ดีดไปหน้า LINE OA
                setTimeout(() => {
                    window.location.href = CONFIG.lineOaUrl;
                }, 800);

            } catch (error) {
                console.error('Error:', error);
                window.location.href = CONFIG.lineOaUrl;
            }
        }

        main();
    </script>
</body>
</html>
